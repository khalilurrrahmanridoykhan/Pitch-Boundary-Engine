services:
  mock_api:
    build: ./mock_api
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/jobs/events')"]
      interval: 2s
      timeout: 2s
      retries: 15

  runner:
    build: .
    depends_on:
      mock_api:
        condition: service_healthy
